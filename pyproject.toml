[project]
name = "energy-insights"
version = "0.1.0"
description = "Explanatory pages on the German energy system, built as executable Dagster assets against energy-data-hub's data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # page infrastructure
    "dagster>=1.9.0",
    "ipykernel>=6.29.0",
    "jupytext>=1.19.0",
    "mystmd>=1.8.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.0",
    # analysis packages
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pillow>=10.0.0",
    "xarray>=2024.9.0",
    "netcdf4>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insights_dagster"]

[tool.dagster]
module_name = "insights_dagster.definitions"
